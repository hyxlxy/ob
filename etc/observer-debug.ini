# observer's configuration for DEBUG mode
# Use this configuration when you need detailed logs for debugging

# log part
[LOG]
# log file's name, default is ${process_name_}.log
LOG_FILE_NAME = observer.log
#  LOG_LEVEL_PANIC = 0,
#  LOG_LEVEL_ERR = 1,
#  LOG_LEVEL_WARN = 2,
#  LOG_LEVEL_INFO = 3,
#  LOG_LEVEL_DEBUG = 4,
#  LOG_LEVEL_TRACE = 5,
#  LOG_LEVEL_LAST
# DEBUG mode: Enable detailed logging for troubleshooting
LOG_FILE_LEVEL=1
LOG_CONSOLE_LEVEL=1
# Enable debug modules for specific components
DefaultLogModules="expression.cpp,vector_type.cpp,arithmetic_expr.cpp,comparison_expr.cpp"

# server part
[SERVER]
# server listen port
PORT=6789
# server listen address
BIND_ADDRESS=127.0.0.1
# max connection number
MAX_CONNECTION_NUM=8192
# thread number to deal with connections
CONNECTION_THREAD_NUM=4

# database part
[DB]
# database name
DB_NAME=miniob
# database data directory
DATA_DIR=./miniob
# database log directory
LOG_DIR=./miniob/log
# database buffer pool size
BUFFER_POOL_SIZE=1024
# database page size
PAGE_SIZE=4096
