# observer's configuration for PRODUCTION mode
# Use this configuration to minimize log output and save disk space

# log part
[LOG]
# log file's name, default is ${process_name_}.log
LOG_FILE_NAME = observer.log
#  LOG_LEVEL_PANIC = 0,
#  LOG_LEVEL_ERR = 1,
#  LOG_LEVEL_WARN = 2,
#  LOG_LEVEL_INFO = 3,
#  LOG_LEVEL_DEBUG = 4,
#  LOG_LEVEL_TRACE = 5,
#  LOG_LEVEL_LAST
# PRODUCTION mode: Only log errors to save disk space
# 0=Panic,1=Error,2=Warn,3=Info,4=Debug,5=Trace
LOG_FILE_LEVEL=1
LOG_CONSOLE_LEVEL=1
# No default debug modules in production

# server part
[SERVER]
# server listen port
PORT=6789
# server listen address
BIND_ADDRESS=127.0.0.1
# max connection number
MAX_CONNECTION_NUM=8192
# thread number to deal with connections
CONNECTION_THREAD_NUM=4

# database part
[DB]
# database name
DB_NAME=miniob
# database data directory
DATA_DIR=./miniob
# database log directory
LOG_DIR=./miniob/log
# database buffer pool size
BUFFER_POOL_SIZE=1024
# database page size
PAGE_SIZE=4096
