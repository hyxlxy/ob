# observer's configuration

# log part
[LOG]
# log file's name, default is ${process_name_}.log
LOG_FILE_NAME = observer.log
#  LOG_LEVEL_PANIC = 0,
#  LOG_LEVEL_ERR = 1,
#  LOG_LEVEL_WARN = 2,
#  LOG_LEVEL_INFO = 3,
#  LOG_LEVEL_DEBUG = 4,
#  LOG_LEVEL_TRACE = 5,
#  LOG_LEVEL_LAST
# output log level, default is LOG_LEVEL_INFO
LOG_FILE_LEVEL=5
LOG_CONSOLE_LEVEL=1
# the module's log will output whatever level used.
#DefaultLogModules="server.cpp,client.cpp"

# server part
[SERVER]
# server listen port
PORT=6789
# server listen address
BIND_ADDRESS=127.0.0.1
# max connection number
MAX_CONNECTION_NUM=8192
# thread number to deal with connections
CONNECTION_THREAD_NUM=4

# database part
[DB]
# database name
DB_NAME=miniob
# database data directory
DATA_DIR=./miniob
# database log directory
LOG_DIR=./miniob/log
# database buffer pool size
BUFFER_POOL_SIZE=1024
# database page size
PAGE_SIZE=4096
